<!doctype html><html><head><meta charset="utf-8"><title>detail-map.js test</title>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/chris-inv-am/gift-estimator@main/docs/poc/detail-map.js"></script>
<style>body{font-family:system-ui;padding:16px}img{width:400px;height:400px;border:1px solid #e3e6ea;display:block}.row{display:flex;gap:16px;flex-wrap:wrap}</style></head>
<body><h3>renderDetailMap() from the CDN copy of the repo</h3><div class="row" id="out"></div>
<script>
window.__results = {};
async function run(label, opts){ const t=Date.now(); const png = await renderDetailMap(opts); const ms=Date.now()-t; window.__results[label]={ok:!!png, ms, bytes: png?png.length:0}; const d=document.createElement('div'); d.innerHTML='<div><b>'+label+'</b> '+(png?'ok':'fallback')+' in '+ms+' ms</div>'; if(png){const i=new Image(); i.src=png; d.appendChild(i);} document.getElementById('out').appendChild(d); }
(async()=>{
  await run('60637 alone', {zips:['60637']});
  await run('60637+60649+60653', {zips:['60637','60649','60653']});
  await run('90210', {zips:['90210']});
  await run('too wide (60637 + 61602 Peoria) -> fallback expected', {zips:['60637','61602']});
  window.__done = true;
})();
</script></body></html>
